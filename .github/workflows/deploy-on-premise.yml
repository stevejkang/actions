name: Deploy to on-premise

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name (e.g. my-app)'
        required: true
        type: string
      host:
        description: 'Tailscale IP or hostname of the target machine'
        required: true
        type: string
      user:
        description: 'SSH user on the target machine'
        required: false
        type: string
        default: 'root'
      deploy-path:
        description: 'Working directory on the target machine for deployment'
        required: true
        type: string
      deploy-command:
        description: 'Command to run after docker pull (e.g. "docker compose up -d", "docker run ...")'
        required: false
        type: string
        default: 'docker compose up -d'
      dockerfile:
        description: 'Dockerfile path relative to repo root'
        required: false
        type: string
        default: './Dockerfile'
      context:
        description: 'Docker build context relative to repo root'
        required: false
        type: string
        default: '.'
      ssh-port:
        description: 'SSH port on the target machine'
        required: false
        type: number
        default: 22
      use-sudo:
        description: 'Use sudo for docker commands on the target machine'
        required: false
        type: boolean
        default: false
      tailscale-tags:
        description: 'Tailscale ACL tags for ephemeral node'
        required: false
        type: string
        default: 'tag:ci'
      infisical-identity-id:
        description: 'Infisical Machine Identity ID (OIDC, public value)'
        required: true
        type: string
      infisical-project-slug:
        description: 'Infisical project slug'
        required: true
        type: string
      infisical-env-slug:
        description: 'Infisical environment slug'
        required: false
        type: string
        default: 'prod'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ inputs.infisical-identity-id }}
          project-slug: ${{ inputs.infisical-project-slug }}
          env-slug: ${{ inputs.infisical-env-slug }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ inputs.tailscale-tags }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ inputs.ssh-port }} ${{ inputs.host }} >> ~/.ssh/known_hosts

      - name: Sync repository
        run: |
          ssh -p ${{ inputs.ssh-port }} ${{ inputs.user }}@${{ inputs.host }} "\
            mkdir -p ${{ inputs.deploy-path }} && \
            cd ${{ inputs.deploy-path }} && \
            if [ -d .git ]; then \
              git fetch origin && git checkout -f ${{ github.sha }}; \
            else \
              git init && \
              git remote add origin git@github.com:${{ github.repository }}.git && \
              git fetch origin && \
              git checkout -f ${{ github.sha }}; \
            fi"

      - name: Deploy
        env:
          SUDO: ${{ inputs.use-sudo && 'sudo' || '' }}
        run: |
          ssh -p ${{ inputs.ssh-port }} ${{ inputs.user }}@${{ inputs.host }} "\
            export PATH=/usr/local/bin:\$PATH && \
            cd ${{ inputs.deploy-path }} && \
            $SUDO docker pull ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:latest && \
            ${{ inputs.deploy-command }}"
